# Fails when the committed aggregates go stale — the server-side complement to
# the frontend banner, so a silently-dead refresh schedule is caught without
# waiting for someone to load the page. Thresholds mirror frontend/app.js.
#
# This bridges an external Claude routine that stops publishing to a failing GitHub
# check. Email requires the schedule actor's Actions notification preferences.
# It checks every ongoing event as well as the aggregate, and compares live Pages
# data with main. History is exempt; threat refreshes rotate weekly.
# Schedules can be delayed or disabled by GitHub inactivity policies.
name: staleness
on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC — hours after both refresh routines
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed and deployed freshness
        run: python3 scripts/check_freshness.py --live
