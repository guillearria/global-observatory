# Optional Telegram self-test, invoked explicitly by a human.
# Automatic failure alerts use GitHub's native Actions email, whose delivery
# depends on the workflow actor and notification settings. No automatic Telegram
# listener is enabled, so missing Telegram secrets cannot add a second failed run.
#
# workflow_dispatch posts a real message when configured. Do not dispatch it
# during a read-only audit. Missing secrets fail visibly, and ambiguous sends
# are never retried because a timeout can otherwise double-post.
name: notify
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  telegram:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send explicit Telegram self-test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Self-test unavailable — set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. Nothing was sent."
            exit 1
          fi
          python3 scripts/notify.py - <<EOF
          ✅ global-observatory: manual Telegram self-test

          This confirms a manual test message only. Automatic Telegram failure alerts are disabled.
          GitHub Actions failure emails depend on your notification settings.

          ${RUN_URL}
          EOF
