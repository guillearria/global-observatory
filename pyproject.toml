[project]
name = "global-observatory"
version = "0.1.0"
description = "A fact-based observatory of the world: confirmed major events alongside standing existential threats, where every published figure is grounded in an authoritative source."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned to a minor range on purpose: ruff 0.16 widened its *default* rule set, which
    # turned a green CI red on a data-only PR. The `select` below fixes what we lint; this
    # pin keeps a future default change from moving the goalposts again.
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Explicit, so `ruff check .` enforces the same thing regardless of which ruff version CI
# resolves. EXE is deliberately absent: the shebangs in scripts/ are documentation — the
# scripts are invoked as `python scripts/…`. RUF100 only, not all of RUF: RUF001 flags every
# en dash, and this repo's strings are prose. BLE is on so the one intentional
# `# noqa: BLE001` stays meaningful instead of becoming a RUF100 violation.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "ISC", "BLE", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
