<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Stop iOS Safari auto-linking number-like text (report IDs, tolls) in UA blue. -->
    <meta name="format-detection" content="telephone=no" />
    <title>
      Global Observatory — live world events, existential threats &amp;
      historical archive
    </title>
    <meta
      name="description"
      content="A fact-based observatory of the world: a live pulse of confirmed major events on a world map, an ongoing tracker of existential threats, and a historical archive reaching back to the dawn of civilization. Every published figure is grounded in an authoritative source — an aggregation, not a forecast."
    />
    <link
      rel="canonical"
      href="https://guillearria.github.io/global-observatory/"
    />
    <!-- The mark, inline as a data URI: the site makes no external requests, and there is
       no separate icon file to fall out of step with the masthead. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f1115%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2211%22 fill=%22none%22 stroke=%22%236ea8fe%22 stroke-width=%222%22/%3E%3Cellipse cx=%2216%22 cy=%2216%22 rx=%224.6%22 ry=%2211%22 fill=%22none%22 stroke=%22%236ea8fe%22 stroke-width=%221.2%22 opacity=%220.5%22/%3E%3Cpath d=%22M4 16h5.5l2.5-4.5 3 9.5 2.5-7 1.5 2H28%22 fill=%22none%22 stroke=%22%236ea8fe%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"
    />
    <!-- Display face: self-hosted, subsetted. A hosted-font <link> would break the
       zero-external-requests property (see styles.css @font-face). -->
    <link
      rel="preload"
      href="./assets/fonts/newsreader-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Observatory" />
    <meta
      property="og:title"
      content="Global Observatory — live world events, existential threats &amp; historical archive"
    />
    <meta
      property="og:description"
      content="A fact-based observatory of the world: a live pulse of confirmed major events on a world map, an ongoing tracker of existential threats, and a historical archive reaching back to the dawn of civilization. Every published figure is grounded in an authoritative source — an aggregation, not a forecast."
    />
    <meta
      property="og:url"
      content="https://guillearria.github.io/global-observatory/"
    />
    <meta
      property="og:image"
      content="https://guillearria.github.io/global-observatory/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Global Observatory — a globe with a pulse line; a fact-based observatory of the world"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <header class="masthead">
        <a class="brand" href="#events"
          ><svg viewBox="0 0 32 32" aria-hidden="true">
            <circle
              cx="16"
              cy="16"
              r="12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M4 16h7l2-5 4 11 3-7h8"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            /></svg
          >Global Observatory</a
        >
        <nav aria-label="Sections">
          <a href="#events">Emergencies</a><a href="#threats">Risks</a
          ><a href="#historical">History</a><a href="#about">About</a>
        </nav>
      </header>
      <main id="main"><p role="status">Loading collections…</p></main>
      <noscript
        >Enable JavaScript to explore the collections. Raw data is available in
        the source repository.</noscript
      >
      <footer class="footer">
        <span>Explore emergencies, risks and history.</span
        ><a
          href="https://github.com/guillearria/global-observatory"
          target="_blank"
          rel="noopener noreferrer"
          >Source code</a
        >
      </footer>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
